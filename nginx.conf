server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses (TLS handled by Traefik upstream).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached (it references the latest hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
