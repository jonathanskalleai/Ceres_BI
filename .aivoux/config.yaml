project:
  name: ""
  type: greenfield                # greenfield ou brownfield

# Modo de execucao do Smart Router
# - false (default): Router apresenta plano e pede confirmacao
# - true: Router executa pipeline end-to-end automaticamente sem pausar
#
# ⚠ yolo_mode NAO significa pular etapas. Significa APENAS "nao pausar para
# confirmacao entre etapas". TODOS os agentes do pipeline (dev → reviewer →
# qa → scribe → devops) rodam do mesmo jeito, na mesma ordem. Pular etapa
# exige autorizacao EXPLICITA do usuario (ver pipeline-integrity.md).
yolo_mode: true

# Pipeline Integrity (F6) — enforcement MECANICO do pipeline via hooks.
# Estado em .aivoux/gates/ (gitignored, sessao-local):
#   agent-trace.sh (PostToolUse) registra todo subagent spawnado;
#   deploy-gate.sh (PreToolUse)  bloqueia push/PR/deploy sem QA PASS ancorado
#                                ao SHA + spawn real de aivoux-qa + reviewer
#                                PASS ancorado + smoke dos critical_paths;
#   review-gate.sh (PreToolUse)  bloqueia spawn de aivoux-qa sem spawn de
#                                aivoux-reviewer apos o ultimo agente de codigo
#                                (@reviewer e SEMPRE obrigatorio, inclusive
#                                SIMPLE — complexidade nao remove gate);
#   scribe-gate.sh (Stop)        bloqueia fechamento se @qa PASS sem @scribe.
# Override APENAS com autorizacao explicita do usuario (uso unico, auditado).
pipeline_integrity:
  enabled: true
  verdict_file: .aivoux/gates/qa-verdict.json
  reviewer_verdict_file: .aivoux/gates/reviewer-verdict.json
  agents_log: .aivoux/gates/agents-run.log

# Plan Mode — TODOS os agentes em Opus (exceto scribe em Haiku). Sem tiers.
# Router usa Claude Code Task tool para spawnar cada agente com o modelo
# correto automaticamente (enforced via frontmatter do subagent).
plan_mode:
  enabled: true
  planning_model: opus            # opus | sonnet | haiku
  execution_model: opus           # opus | sonnet | haiku
  scribe_model: haiku             # haiku para docs/scan (eficiencia)
  auto_switch: true               # router faz switch automatico via Task tool

# Context Scan (PASSO 0 do router)
# Router le o estado do projeto antes de planejar/executar qualquer coisa.
# Usa Haiku (leitura/sintese barata) e cacheia o resultado para reuso.
context_scan:
  enabled: true
  model: haiku
  cache_file: .aivoux/context-snapshot.md
  cache_ttl_days: 7               # re-escanea se cache > 7 dias
  invalidate_on:                  # arquivos cujo mtime invalida cache
    - package.json
    - tsconfig.json
    - .aivoux/config.yaml
  read_feature_docs: true         # antes de alterar, le docs/features/{slug}.md se existir

# Documentation Mode (Haiku, barato) — memoria permanente do projeto
# ESCRITA: apos @qa PASS (router PASSO 4.5), @scribe atualiza/cria doc compacta em
# docs/features/{slug}.md + linha no index_file. Atualizar > criar.
# LEITURA: router le index_file no PASSO 1 de TODA demanda, injeta docs com match
# de keyword (max 2) no prompt dos subagentes. Linha `Docs:` do ▶/✓ comprova.
documentation_mode:
  enabled: true
  model: haiku
  feature_docs_dir: docs/features
  index_file: docs/features/index.md  # indice lido pelo router no inicio de cada demanda
  max_docs_injected: 2            # max de docs injetadas por demanda (contexto minimo)
  update_on: [feature_complete]   # feature_complete | manual
  max_tokens_per_doc: 400         # mantem doc compacto (reduz custo de leitura futura)
  update_claude_md: false         # nao mexe no CLAUDE.md raiz (bloco aivoux e controlado)

# Discover — deep scan MANUAL de projeto brownfield (/aivoux/discover)
# Semeia a memoria do projeto (docs/features/* + index + .aivoux/infra.md)
# validando claims com o usuario, e gera docs/tech-debt.md com evidencia de
# ferramenta (knip/jscpd/depcheck via npx). READ-ONLY no codigo, zero delete.
discover:
  max_areas: 10                   # max de areas funcionais mapeadas por run
  tools_timeout_s: 120            # timeout por ferramenta de analise
  tools: [knip, jscpd, depcheck]  # rodadas via npx -y em projetos JS/TS; degrade gracioso

# Discussion Mode (deliberacao multi-agente antes de implementar)
# Agentes dao suas opinioes em paralelo, router sintetiza consenso, e
# debate acontece apenas se houver divergencia significativa.
# Detalhes em .claude/rules/discussion-protocol.md
discussion_mode:
  enabled: true
  min_complexity: MEDIUM          # SIMPLE | MEDIUM | COMPLEX
  participants: [analyst, pm, architect, ux]
  include_data_engineer: auto     # auto | always | never
  max_tokens_per_agent: 500
  max_total_tokens: 5500
  allow_debate_round: true        # 1 round de replica se divergirem
  parallel_execution: true        # opinioes em paralelo (reduz latencia)

# Regression Gate (F4) — blast radius + smoke das features vizinhas afetadas
# Router computa o raio de impacto (script deterministico) antes do @qa;
# @qa executa os smokes registrados em docs/features/{slug}.md (secao ## Smoke).
# Detalhes em .claude/rules/regression-gate.md
regression_gate:
  enabled: true
  script: .claude/hooks/blast-radius.sh
  max_affected_smokes: 5          # max de smokes de afetadas executados por pipeline
  block_on_smoke_fail: true       # smoke de afetada falhou -> @qa FAIL (devolve ao @dev)
  critical_paths: []              # slugs "coracao" — smoke roda em TODO pipeline que toca codigo
                                  # ex: [atendimento-whatsapp, pipeline-mensagens]

# Security Gate — @security roda como gate CONDICIONAL no pipeline (apos @reviewer,
# antes do @qa) SOMENTE quando a mudanca toca superficie sensivel. Tambem e o
# executor da auditoria /aivoux/audit-security (relatorio read-only em docs/security/).
# Detalhes em .claude/rules/security-standards.md (secao "Enforcement via @security").
security_gate:
  enabled: true
  # keywords que sinalizam escopo sensivel — o router tambem inspeciona o diff real
  sensitive_keywords: [auth, login, senha, password, token, jwt, sessao, oauth,
    rls, role, permissao, admin, pagamento, payment, upload, webhook, cors,
    secret, api key, pii, cpf]
  # fluxos "coroa" — se o /aivoux/audit-security rodar, sugere preencher aqui os
  # fluxos que, se vazarem, matam o negocio (validados com o usuario)
  sensitive_paths: []
  block_on_vulnerable: true       # verdict VULNERABLE (CRITICAL/HIGH) -> volta ao @dev
  report_dir: docs/security        # relatorio + backlog da auditoria

# Story mode (cria story em docs/stories/ antes de implementar)
story_mode: false

# Quality gates (executados antes de finalizar qualquer trabalho)
quality_gates:
  lint: true
  typecheck: true
  tests: true
  build: true
  coderabbit: false

# 12 Best Practices (coding standards)
# Quando true, @dev aplica, @reviewer barra estrutura e @qa valida
# Tamanho de componente em 3 niveis:
#   meta (codigo novo) -> warn (considere quebrar) -> hard gate (FAIL, monolito)
coding_standards:
  enforce: true
  component_meta_lines: 200       # meta ideal para codigo novo
  component_warn_lines: 300       # aviso — quebrar em breve (hook avisa, nao bloqueia)
  component_hard_gate: 400        # HARD gate — FAIL acima (qa/reviewer/quality-guard hook)
  max_any_usage: 0                # 0 = proibido any sem justificativa
  min_test_coverage: 80           # % minima para logica critica
  enforce_a11y: true              # WCAG 2.1 AA

# Observability (F5) — logs obrigatorios + error tracking + health
# Detalhes em .claude/rules/observability-standards.md
# error_tracking: preencher por projeto (DSN Sentry/GlitchTip ou canal webhook).
# Vazio = @devops BLOQUEIA deploy em projeto com usuarios reais (require_tracking_on_deploy).
observability:
  enforce: true
  error_tracking: ""              # ex: https://...@sentry.io/123 | webhook Telegram/Slack
  require_tracking_on_deploy: true
  health_endpoint: ""             # ex: /health — preenchido quando o projeto tiver

coderabbit:
  enabled: false
  installation_mode: local
  max_iterations: 2
  severity_filter: [CRITICAL, HIGH]

# Context Watch — avisa quando sessao esta longa para sugerir /clear
# warn_at: numero de turnos para comecar a avisar (default: 20)
# Apos o primeiro aviso, repete a cada 10 turnos adicionais (30, 40, ...)
# Reset automatico apos 1h de inatividade (nova sessao detectada)
context_watch:
  enabled: true
  warn_at: 20

# Context Rehydration — salva estado cognitivo e re-injeta apos compactacao
# Evita perda de contexto quando a janela enche ou usuario faz /clear.
# save_at: turno para primeira instrucao de save (antes do warn_at)
# save_interval: re-salva a cada N turnos apos save_at
# auto_inject: injeta digest automaticamente no primeiro prompt pos-compactacao
# stale_hours: ignora digest mais velho que N horas (evita confusao)
context_rehydration:
  enabled: true
  save_at: 12
  save_interval: 8
  auto_inject: true
  stale_hours: 2

dev:
  stories_location: docs/stories
  architecture_location: docs/architecture
