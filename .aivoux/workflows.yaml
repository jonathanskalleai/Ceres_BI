# AIVOUX - Workflow Definitions
# Referencia para o Smart Router e execucao direta de workflows

workflows:
  # 1. Development Cycle (modo development — iteracao)
  - id: development-cycle
    name: Development Cycle
    mode: development
    description: Fluxo curto para iteracao; registra codigo pendente de auditoria
    chain:
      - agent: "@architect"
        action: Design de arquitetura e plano de implementacao
        output: Arquitetura + plano com tasks
        skip_if: complexidade SIMPLE
      - agent: "@data-engineer"
        action: Schema design e migrations
        output: Schema DDL + migration files
        skip_if: sem componente de banco de dados
      - agent: "@dev"
        action: Implementacao de codigo + testes
        output: Codigo implementado e testado
      - agent: "@devops"
        action: Push de branch/PR ou preview não produtivo quando solicitado
        output: Codigo publicado no fluxo de desenvolvimento
        skip_if: usuario nao solicitar

  # 2. Full Cycle (modo full — aprovacao/release)
  - id: full-cycle
    name: Full Cycle
    mode: full
    description: Fluxo completo com reviewer, security condicional, QA e DevOps gated
    chain:
      - agent: "@architect"
        action: Design de arquitetura e plano de implementacao
        output: Arquitetura + plano com tasks
        skip_if: complexidade SIMPLE
      - agent: "@data-engineer"
        action: Schema design e migrations
        output: Schema DDL + migration files
        skip_if: sem componente de banco de dados
      - agent: "@dev"
        action: Implementacao de codigo + testes
        output: Codigo implementado e testado
      - agent: "@reviewer"
        action: Gate estrutural do diff
        output: PASS/FAIL reviewer verdict
      - agent: "@security"
        action: Threat model e security review quando a superficie for sensivel
        output: SECURE/CONCERNS/VULNERABLE verdict
        skip_if: diff nao sensivel
      - agent: "@qa"
        action: Validacao funcional, runtime e regressao
        output: PASS/CONCERNS/FAIL verdict
      - agent: "@devops"
        action: Push, PR, release ou deploy apos os gates
        output: Codigo no remote + PR/release
        skip_if: usuario nao solicitar

  # 3. Audit de pendencias do modo development
  - id: development-audit
    name: Development Audit
    mode: full
    description: Revisa registros pendentes sem repetir planejamento ou implementacao
    chain:
      - agent: "@reviewer"
        action: Auditar os arquivos dos registros PENDING_REVIEW
        output: PASS/FAIL reviewer verdict
      - agent: "@security"
        action: Auditar superficie sensivel quando aplicavel
        output: SECURE/CONCERNS/VULNERABLE verdict
        skip_if: diff nao sensivel
      - agent: "@qa"
        action: Executar testes, runtime e smokes; atualizar status dos registros
        output: PASS/CONCERNS/FAIL e APPROVED/NEEDS_FIX

  # 4. QA Loop (review iterativo)
  - id: qa-loop
    name: QA Loop
    description: Ciclo review-fix ate aprovacao
    max_iterations: 3
    chain:
      - agent: "@qa"
        action: Review do codigo
        output: PASS/FAIL com issues
      - agent: "@dev"
        action: Corrigir issues reportados
        output: Fixes aplicados
        condition: QA verdict FAIL
      - agent: "@qa"
        action: Re-review apos fixes
        output: Verdict final

  # 5. Spec Pipeline (pre-implementacao)
  - id: spec-pipeline
    name: Spec Pipeline
    description: Transformar requisitos informais em spec executavel
    chain:
      - agent: "@pm"
        action: Coletar e estruturar requisitos
        output: Requirements document
      - agent: "@architect"
        action: Avaliar complexidade e definir arquitetura
        output: Complexity assessment + architecture
      - agent: "@analyst"
        action: Pesquisa de mercado/tecnologia
        output: Research findings
        skip_if: complexidade SIMPLE
      - agent: "@pm"
        action: Escrever spec completa
        output: Spec document
      - agent: "@qa"
        action: Critique da spec
        output: APPROVED/NEEDS_REVISION

  # 6. Brownfield Discovery (projetos existentes)
  - id: brownfield
    name: Brownfield Discovery
    description: Assessment de projeto existente
    chain:
      - agent: "@architect"
        action: Analise de arquitetura existente
        output: System architecture assessment
      - agent: "@data-engineer"
        action: Audit de banco de dados
        output: Schema audit + recommendations
        skip_if: sem banco de dados
      - agent: "@ux"
        action: Audit de frontend
        output: Frontend assessment
        skip_if: sem frontend
      - agent: "@qa"
        action: Quality assessment geral
        output: Quality report
      - agent: "@pm"
        action: Criar epic com stories de melhoria
        output: Epic + stories priorizadas
