# Docker Swarm stack for Ceres BI (single-node swarm, local image — no registry).
# Traefik (v3.5) terminates TLS and routes by Host. Labels MUST live under
# deploy.labels because the Traefik provider is providers.swarm (service labels).
version: "3.8"

services:
  web:
    # The deploy script injects the immutable Git SHA tag. Do not replace this
    # with :latest: Swarm would then be able to restart an old dashboard image.
    image: ${CERESBI_WEB_IMAGE:?CERESBI_WEB_IMAGE is required}
    networks:
      - redeinterna
    volumes:
      # Hashed Vite assets are retained across rolling image replacements so
      # open tabs can finish importing chunks from the previous release.
      - ceresbi_web_assets:/usr/share/nginx/html/assets
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ceresbi.entrypoints=websecure"
        - "traefik.http.routers.ceresbi.rule=Host(`ceresbi.vouxconsultoria.com.br`) && !PathPrefix(`/api/ai`) && !PathPrefix(`/api/bi`)"
        - "traefik.http.routers.ceresbi.tls=true"
        - "traefik.http.routers.ceresbi.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ceresbi.loadbalancer.server.port=80"

  ai:
    image: ${CERESBI_AI_IMAGE:?CERESBI_AI_IMAGE is required}
    networks:
      - redeinterna
    environment:
      OPENROUTER_API_KEY: ${CERESBI_AI_OPENROUTER_API_KEY:?CERESBI_AI_OPENROUTER_API_KEY is required}
      DATABASE_URL: ${CERESBI_AI_DATABASE_URL:?CERESBI_AI_DATABASE_URL is required}
      AI_JOB_TOKEN: ${CERESBI_AI_JOB_TOKEN:?CERESBI_AI_JOB_TOKEN is required}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?SUPABASE_JWT_SECRET is required}
      STATE_DATABASE_URL: ${CERESBI_AI_STATE_DATABASE_URL:-}
      ANALYTICAL_DATABASE_URL: ${CERESBI_AI_ANALYTICAL_DATABASE_URL:-}
      YA_AGENT_V2_ENABLED: ${CERESBI_AI_YA_AGENT_V2_ENABLED:-false}
      YA_CHAT_MODEL: ${CERESBI_AI_YA_CHAT_MODEL:-meta-llama/llama-3.3-70b-instruct}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ceresbi-ai.entrypoints=websecure"
        - "traefik.http.routers.ceresbi-ai.rule=Host(`ceresbi.vouxconsultoria.com.br`) && PathPrefix(`/api/ai`)"
        - "traefik.http.routers.ceresbi-ai.tls=true"
        - "traefik.http.routers.ceresbi-ai.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ceresbi-ai.loadbalancer.server.port=8000"
        - "traefik.http.middlewares.ai-strip.stripprefix.prefixes=/api"
        - "traefik.http.routers.ceresbi-ai.middlewares=ai-strip"

  bi:
    image: ${CERESBI_BI_IMAGE:?CERESBI_BI_IMAGE is required}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - redeinterna
    secrets:
      - bi_database_url
      - bi_jwt_secret
    environment:
      BI_DATABASE_URL_FILE: /run/secrets/bi_database_url
      BI_SUPABASE_JWT_SECRET_FILE: /run/secrets/bi_jwt_secret
      BI_SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      BI_DATABASE_POOL_MIN: ${CERESBI_BI_DATABASE_POOL_MIN:-1}
      BI_DATABASE_POOL_MAX: ${CERESBI_BI_DATABASE_POOL_MAX:-8}
      BI_STATEMENT_TIMEOUT_MS: ${CERESBI_BI_STATEMENT_TIMEOUT_MS:-30000}
      BI_LOCK_TIMEOUT_MS: ${CERESBI_BI_LOCK_TIMEOUT_MS:-5000}
      BI_CACHE_TTL_SECONDS: ${CERESBI_BI_CACHE_TTL_SECONDS:-5}
      BI_CACHE_MAX_ITEMS: ${CERESBI_BI_CACHE_MAX_ITEMS:-512}
      BI_CACHE_MAX_ENTRY_BYTES: ${CERESBI_BI_CACHE_MAX_ENTRY_BYTES:-1000000}
      BI_CORS_ORIGINS: ${CERESBI_BI_CORS_ORIGINS:-https://ceresbi.vouxconsultoria.com.br}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.ceresbi-bi.entrypoints=websecure"
        - "traefik.http.routers.ceresbi-bi.rule=Host(`ceresbi.vouxconsultoria.com.br`) && PathPrefix(`/api/bi`)"
        - "traefik.http.routers.ceresbi-bi.tls=true"
        - "traefik.http.routers.ceresbi-bi.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.ceresbi-bi.middlewares=ceresbi-bi-ratelimit,ceresbi-bi-compress"
        - "traefik.http.middlewares.ceresbi-bi-ratelimit.ratelimit.average=20"
        - "traefik.http.middlewares.ceresbi-bi-ratelimit.ratelimit.burst=40"
        - "traefik.http.middlewares.ceresbi-bi-ratelimit.ratelimit.period=1s"
        - "traefik.http.middlewares.ceresbi-bi-compress.compress=true"
        - "traefik.http.services.ceresbi-bi.loadbalancer.server.port=8100"

networks:
  redeinterna:
    external: true

volumes:
  ceresbi_web_assets:
    driver: local

secrets:
  bi_database_url:
    external: true
    name: ${CERESBI_BI_DATABASE_URL_SECRET:-ceresbi_bi_database_url_v1}
  bi_jwt_secret:
    external: true
    name: ${CERESBI_BI_JWT_SECRET:-ceresbi_bi_jwt_secret_v1}
