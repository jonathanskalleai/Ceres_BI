<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa · Ceres BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/font-system.js"></script>
  <link rel="stylesheet" href="assets/voux.css">
  <link rel="stylesheet" href="assets/layout.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    #mapa-container { height:500px; border-radius:12px; overflow:hidden; border:1px solid var(--voux-border); }
    .leaflet-container { background:#141820; }
    .leaflet-popup-content-wrapper { background:var(--voux-surface); border:1px solid var(--voux-border); border-radius:10px; color:var(--voux-text); font-family:"Inter",sans-serif; font-size:12px; }
    .leaflet-popup-tip { background:var(--voux-surface); }
    .leaflet-popup-content { margin:12px 14px; }
    .popup-title { font-weight:600; font-size:13px; margin-bottom:6px; color:var(--voux-text); }
    .popup-row { display:flex; justify-content:space-between; gap:16px; font-size:11px; color:var(--voux-text-muted); padding:2px 0; }
    .popup-val { font-family:"JetBrains Mono",monospace; font-weight:600; color:var(--voux-champagne-400); }
    .map-tabs { display:flex; gap:8px; margin-bottom:12px; }
    .map-tab { padding:6px 16px; border-radius:20px; font-size:12px; font-weight:500; cursor:pointer; border:1px solid var(--voux-border); color:var(--voux-text-muted); background:transparent; transition:all .2s; }
    .map-tab--active { background:rgba(212,184,150,.15); border-color:rgba(212,184,150,.4); color:var(--voux-champagne-400); }
    .legend { display:flex; gap:16px; margin-top:10px; font-size:11px; color:var(--voux-text-muted); align-items:center; }
    .legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  </style>
</head>
<body data-page="mapa">
  <div class="app">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar" data-topbar></header>
      <div class="toolbar" data-toolbar></div>
      <div class="content">

        <section class="kpis">
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">01 · Pontos no Mapa</span></div>
            <div class="kpi__value voux-num" id="kpi-pontos">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">com coordenadas</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">02 · Cidades</span></div>
            <div class="kpi__value voux-num" id="kpi-cidades">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">municípios</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">03 · Alta Atividade</span></div>
            <div class="kpi__value voux-num" id="kpi-alta" style="color:#22c55e;">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">regiões verdes</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">04 · Baixa Atividade</span></div>
            <div class="kpi__value voux-num" id="kpi-baixa" style="color:#ef4444;">—</div>
            <div class="kpi__delta kpi__delta--down">regiões vermelhas</div>
          </div>
        </section>

        <article class="voux-card">
          <div class="voux-card__head"><div>
            <div class="voux-card__label">01 · MAPA DE ATIVIDADE</div>
            <h3 class="voux-card__title">Cobertura <em>Geográfica CRM</em></h3>
          </div></div>
          <div class="map-tabs">
            <button class="map-tab map-tab--active" data-view="regioes">Por Região</button>
            <button class="map-tab" data-view="clientes">Por Registro</button>
          </div>
          <div id="mapa-container"></div>
          <div class="legend">
            <div class="legend-dot" style="background:#22c55e;"></div><span>Alta atividade</span>
            <div class="legend-dot" style="background:#eab308;"></div><span>Média atividade</span>
            <div class="legend-dot" style="background:#ef4444;"></div><span>Baixa atividade</span>
          </div>
        </article>

        <article class="voux-card">
          <div class="voux-card__head"><div>
            <div class="voux-card__label">02 · SEM COORDENADAS</div>
            <h3 class="voux-card__title">Cidades <em>não Mapeadas</em></h3>
          </div></div>
          <div id="sem-coords" style="display:flex;flex-wrap:wrap;gap:6px;padding-top:4px;"></div>
        </article>

      </div>
    </main>
  </div>

  <script src="assets/supabase.js"></script>
  <script src="assets/ceres-data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    let mapa, regioesLayer, clientesLayer;
    let currentView = "regioes";

    async function init() {
      await window.CERES_DATA_READY;
      const D = window.CERES_DATA;
      const regioes = D.crm.regioes;
      const registros = D.crm.registrosRecentes;

      VOUX_LAYOUT.renderTopbar({ section: "COMERCIAL CRM", title: "Mapa <em>CRM</em>" });
      VOUX_LAYOUT.renderToolbar({ period: "Base atual" });

      // Filter regions with valid Brazil coords
      const validRegioes = regioes.filter(r => r.lat && r.lng && r.lat > -35 && r.lat < 6 && r.lng > -75 && r.lng < -33);
      const validRegistros = registros.filter(r => r.lat && r.lng && r.lat > -35 && r.lat < 6 && r.lng > -75 && r.lng < -33);
      const semCoords = regioes.filter(r => !r.lat || !r.lng);

      const maxAcoes = Math.max(...validRegioes.map(r => r.totalAcoes), 1);
      const alta = validRegioes.filter(r => r.totalAcoes / maxAcoes >= 0.66).length;
      const baixa = validRegioes.filter(r => r.totalAcoes / maxAcoes < 0.33).length;

      document.getElementById("kpi-pontos").textContent  = D.fmtNum(validRegistros.length);
      document.getElementById("kpi-cidades").textContent = D.fmtNum(validRegioes.length);
      document.getElementById("kpi-alta").textContent    = D.fmtNum(alta);
      document.getElementById("kpi-baixa").textContent   = D.fmtNum(baixa);

      // Init Leaflet map
      const center = validRegioes.length > 0
        ? [validRegioes.reduce((s, r) => s + r.lat, 0) / validRegioes.length, validRegioes.reduce((s, r) => s + r.lng, 0) / validRegioes.length]
        : [-15, -47];
      mapa = L.map("mapa-container", {
        center, zoom: 5,
        attributionControl: false,
        zoomControl: true,
      });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 18,
      }).addTo(mapa);

      // Regioes layer
      regioesLayer = L.layerGroup();
      validRegioes.forEach(r => {
        const pct = r.totalAcoes / maxAcoes;
        const color = pct >= 0.66 ? "#22c55e" : pct >= 0.33 ? "#eab308" : "#ef4444";
        const radius = 6 + Math.sqrt(pct) * 20;
        const circle = L.circleMarker([r.lat, r.lng], {
          radius, color, fillColor: color, fillOpacity: 0.6, weight: 1, opacity: 0.9,
        });
        circle.bindPopup(`
          <div class="popup-title">${r.cidade}</div>
          <div class="popup-row"><span>Ações</span><span class="popup-val">${r.totalAcoes}</span></div>
          <div class="popup-row"><span>Clientes</span><span class="popup-val">${r.clientes}</span></div>
          <div class="popup-row"><span>Visitas</span><span class="popup-val">${r.visitas}</span></div>`);
        regioesLayer.addLayer(circle);
      });
      regioesLayer.addTo(mapa);

      // Clientes/registros layer
      clientesLayer = L.layerGroup();
      validRegistros.forEach(r => {
        const circle = L.circleMarker([r.lat, r.lng], {
          radius: 5, color: "#d4b896", fillColor: "#d4b896", fillOpacity: 0.5, weight: 1,
        });
        circle.bindPopup(`
          <div class="popup-title">${r.cliente || "—"}</div>
          <div class="popup-row"><span>Cidade</span><span class="popup-val">${r.cidade}</span></div>
          <div class="popup-row"><span>Vendedor</span><span class="popup-val">${(r.vendedor || "").split(" ").slice(-1)[0]}</span></div>
          <div class="popup-row"><span>Data</span><span class="popup-val">${r.dtConclusao}</span></div>
          <div class="popup-row"><span>Tipo</span><span class="popup-val">${r.tipoAcao || "—"}</span></div>`);
        clientesLayer.addLayer(circle);
      });

      // Tab switching
      document.querySelectorAll(".map-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".map-tab").forEach(b => b.classList.remove("map-tab--active"));
          btn.classList.add("map-tab--active");
          const view = btn.dataset.view;
          if (view === "regioes") { mapa.removeLayer(clientesLayer); regioesLayer.addTo(mapa); }
          else { mapa.removeLayer(regioesLayer); clientesLayer.addTo(mapa); }
        });
      });

      // Sem coordenadas
      const semEl = document.getElementById("sem-coords");
      semCoords.slice(0, 40).forEach(r => {
        const span = document.createElement("span");
        span.style.cssText = "padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--voux-border);font-size:11px;color:var(--voux-text-muted);";
        span.textContent = `${r.cidade} (${r.totalAcoes})`;
        semEl.appendChild(span);
      });
      if (semCoords.length > 40) {
        const more = document.createElement("span");
        more.style.cssText = "font-size:11px;color:var(--voux-text-muted);align-self:center;";
        more.textContent = `+${semCoords.length - 40} mais`;
        semEl.appendChild(more);
      }
    }
    init();
  </script>
</body>
</html>
