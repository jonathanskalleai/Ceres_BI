<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registros · Ceres BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/font-system.js"></script>
  <link rel="stylesheet" href="assets/voux.css">
  <link rel="stylesheet" href="assets/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .records-wrap { overflow-x:auto; }
    .records-table { width:100%; border-collapse:collapse; font-size:12px; }
    .records-table th { padding:8px 10px; text-align:left; font-size:10px; color:var(--voux-text-muted); font-weight:600; letter-spacing:.07em; text-transform:uppercase; border-bottom:1px solid var(--voux-border); background:rgba(255,255,255,.02); position:sticky; top:0; z-index:1; }
    .records-table td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,.04); color:var(--voux-text-soft); vertical-align:top; }
    .records-table tr:hover td { background:rgba(255,255,255,.03); }
    .tag { display:inline-block; padding:1px 7px; border-radius:20px; font-size:9px; font-family:"JetBrains Mono",monospace; font-weight:600; letter-spacing:.04em; }
    .tag--visita { background:rgba(34,197,94,.12); color:#22c55e; }
    .tag--ligacao { background:rgba(59,130,246,.12); color:#3b82f6; }
    .tag--email   { background:rgba(168,85,247,.12); color:#a855f7; }
    .tag--default { background:rgba(255,255,255,.07); color:var(--voux-text-muted); }
    .search-bar { display:flex; gap:8px; margin-bottom:16px; }
    .search-bar input { flex:1; background:rgba(255,255,255,.05); border:1px solid var(--voux-border); border-radius:8px; padding:8px 14px; font-size:13px; color:var(--voux-text); outline:none; }
    .search-bar input:focus { border-color:rgba(212,184,150,.4); }
    .obs-cell { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--voux-text-muted); }
  </style>
</head>
<body data-page="registros">
  <div class="app">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar" data-topbar></header>
      <div class="toolbar" data-toolbar></div>
      <div class="content">

        <section class="kpis">
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">01 · Total</span></div>
            <div class="kpi__value voux-num" id="kpi-total">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">registros</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">02 · Filtrados</span></div>
            <div class="kpi__value voux-num" id="kpi-filtrados">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">exibidos</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">03 · Clientes</span></div>
            <div class="kpi__value voux-num" id="kpi-clientes">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">únicos</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">04 · Com Obs.</span></div>
            <div class="kpi__value voux-num" id="kpi-obs">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">registros c/ texto</div>
          </div>
        </section>

        <article class="voux-card">
          <div class="voux-card__head">
            <div>
              <div class="voux-card__label">— AÇÕES CRM · CAMPO ATIVIDADE EXECUTADA</div>
              <h3 class="voux-card__title">Registros <em>Recentes</em></h3>
            </div>
          </div>
          <div class="search-bar">
            <input type="text" id="search-input" placeholder="Buscar cliente, vendedor, cidade, observação…" />
          </div>
          <div class="records-wrap" style="max-height:65vh;overflow-y:auto;">
            <table class="records-table">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Cliente</th>
                  <th>Cidade</th>
                  <th>Consultor</th>
                  <th>Tipo Contato</th>
                  <th>Tipo Ação</th>
                  <th>Observação</th>
                </tr>
              </thead>
              <tbody id="records-body"></tbody>
            </table>
          </div>
          <div style="margin-top:10px;font-size:11px;color:var(--voux-text-muted);text-align:center;" id="records-count"></div>
        </article>

      </div>
    </main>
  </div>

  <script src="assets/supabase.js"></script>
  <script src="assets/ceres-data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    let allRecords = [];

    function tagClass(tipo) {
      const t = (tipo || "").toLowerCase();
      if (t.includes("visita")) return "tag--visita";
      if (t.includes("liga") || t.includes("tel")) return "tag--ligacao";
      if (t.includes("email") || t.includes("e-mail")) return "tag--email";
      return "tag--default";
    }

    function renderRows(records) {
      const tbody = document.getElementById("records-body");
      tbody.innerHTML = "";
      const slice = records.slice(0, 200);
      slice.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="font-family:'JetBrains Mono',monospace;font-size:10px;white-space:nowrap;">${r.dtConclusao || "—"}</td>
          <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.cliente || "—"}</td>
          <td style="white-space:nowrap;">${r.cidade || "—"}</td>
          <td style="white-space:nowrap;">${(r.vendedor || "").split(" ").slice(-1)[0]}</td>
          <td><span class="tag ${tagClass(r.tipoContato)}">${r.tipoContato || "—"}</span></td>
          <td><span class="tag ${tagClass(r.tipoAcao)}">${r.tipoAcao || "—"}</span></td>
          <td class="obs-cell" title="${(r.obs || "").replace(/"/g,"&quot;")}">${r.obs || "—"}</td>`;
        tbody.appendChild(tr);
      });
      document.getElementById("records-count").textContent =
        `Exibindo ${slice.length} de ${records.length} registros`;
      document.getElementById("kpi-filtrados").textContent = records.length.toLocaleString("pt-BR");
    }

    async function init() {
      await window.CERES_DATA_READY;
      const D = window.CERES_DATA;
      allRecords = D.crm.registrosRecentes;

      VOUX_LAYOUT.renderTopbar({ section: "COMERCIAL CRM", title: "Registros <em>CRM</em>" });
      VOUX_LAYOUT.renderToolbar({ period: "Base atual" });

      document.getElementById("kpi-total").textContent   = D.fmtNum(D.crm.kpis.totalRegistros);
      document.getElementById("kpi-clientes").textContent = D.fmtNum(new Set(allRecords.map(r => r.cliente).filter(Boolean)).size);
      document.getElementById("kpi-obs").textContent     = D.fmtNum(allRecords.filter(r => r.obs && r.obs.length > 5).length);

      renderRows(allRecords);

      document.getElementById("search-input").addEventListener("input", e => {
        const s = e.target.value.toLowerCase();
        if (!s) { renderRows(allRecords); return; }
        const filtered = allRecords.filter(r =>
          (r.cliente || "").toLowerCase().includes(s) ||
          (r.vendedor || "").toLowerCase().includes(s) ||
          (r.cidade || "").toLowerCase().includes(s) ||
          (r.obs || "").toLowerCase().includes(s)
        );
        renderRows(filtered);
      });
    }
    init();
  </script>
</body>
</html>
