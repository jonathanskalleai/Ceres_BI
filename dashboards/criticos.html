<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes Críticos · Ceres BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/font-system.js"></script>
  <link rel="stylesheet" href="assets/voux.css">
  <link rel="stylesheet" href="assets/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .critico-card { background:var(--voux-surface); border:1px solid var(--voux-border); border-radius:14px; padding:20px; display:flex; gap:20px; flex-wrap:wrap; }
    .critico-card:hover { border-color:rgba(239,68,68,.3); }
    .critico-info { flex:1; min-width:200px; }
    .critico-title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
    .critico-name { font-size:14px; font-weight:600; color:var(--voux-text); }
    .dias-badge { padding:2px 8px; border-radius:20px; font-size:9px; font-family:"JetBrains Mono",monospace; font-weight:700; background:rgba(239,68,68,.15); color:#ef4444; border:1px solid rgba(239,68,68,.3); }
    .priority-badge { font-size:9px; }
    .critico-meta { display:flex; gap:16px; font-size:11px; color:var(--voux-text-muted); margin-bottom:10px; flex-wrap:wrap; }
    .critico-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
    .critico-stat { text-align:center; padding:6px 4px; background:rgba(255,255,255,.03); border-radius:8px; }
    .critico-stat-val { font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:700; color:var(--voux-text-soft); }
    .critico-stat-lbl { font-size:9px; color:var(--voux-text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
    .critico-obs { background:rgba(255,255,255,.03); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--voux-text-muted); line-height:1.5; margin-bottom:8px; }
    .critico-action { width:240px; flex-shrink:0; background:rgba(239,68,68,.05); border:1px solid rgba(239,68,68,.2); border-radius:10px; padding:14px; }
    .critico-action-title { font-size:9px; font-weight:700; color:#ef4444; text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }
    .critico-action-what { font-size:11px; font-weight:600; color:var(--voux-text); margin-bottom:4px; }
    .critico-action-arg  { font-size:11px; color:var(--voux-text-muted); line-height:1.4; }
    .filter-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
    .filter-bar select { background:rgba(255,255,255,.05); border:1px solid var(--voux-border); border-radius:8px; padding:6px 12px; font-size:12px; color:var(--voux-text); cursor:pointer; }
  </style>
</head>
<body data-page="criticos">
  <div class="app">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar" data-topbar></header>
      <div class="toolbar" data-toolbar></div>
      <div class="content">

        <section class="kpis">
          <div class="kpi" style="border-left:3px solid #ef4444;">
            <div class="kpi__head"><span class="kpi__label">01 · Clientes Críticos</span></div>
            <div class="kpi__value voux-num" id="kpi-criticos" style="color:#ef4444;">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">sem contato +90d</div>
          </div>
          <div class="kpi" style="border-left:3px solid #eab308;">
            <div class="kpi__head"><span class="kpi__label">02 · Acima 180 dias</span></div>
            <div class="kpi__value voux-num" id="kpi-180" style="color:#eab308;">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">muito críticos</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">03 · Média Dias</span></div>
            <div class="kpi__value voux-num" id="kpi-media">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">sem contato</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">04 · Acima 365 dias</span></div>
            <div class="kpi__value voux-num" id="kpi-365" style="color:#ef4444;">—</div>
            <div class="kpi__delta kpi__delta--down">urgente reativar</div>
          </div>
        </section>

        <div class="grid-12">
          <article class="voux-card col-6">
            <div class="voux-card__head"><div>
              <div class="voux-card__label">01 · Faixas</div>
              <h3 class="voux-card__title">Distribuição <em>por Inatividade</em></h3>
            </div></div>
            <div class="chart-canvas" id="chart-faixas" style="height:220px;"></div>
          </article>
          <article class="voux-card col-6">
            <div class="voux-card__head"><div>
              <div class="voux-card__label">02 · Por Consultor</div>
              <h3 class="voux-card__title">Críticos <em>por Responsável</em></h3>
            </div></div>
            <div class="chart-canvas" id="chart-por-consultor" style="height:220px;"></div>
          </article>
        </div>

        <article class="voux-card">
          <div class="voux-card__head"><div>
            <div class="voux-card__label">03 · PLANO DE AÇÃO</div>
            <h3 class="voux-card__title">Clientes <em>em Estado Crítico</em></h3>
          </div></div>
          <div class="filter-bar">
            <select id="filter-consultor"><option value="">Todos os consultores</option></select>
            <select id="filter-faixa">
              <option value="">Todas as faixas</option>
              <option value="90">90–120 dias</option>
              <option value="120">120–180 dias</option>
              <option value="180">180–365 dias</option>
              <option value="365">+365 dias</option>
            </select>
          </div>
          <div id="criticos-list" style="display:flex;flex-direction:column;gap:12px;"></div>
          <div id="criticos-count" style="margin-top:12px;font-size:11px;color:var(--voux-text-muted);text-align:center;"></div>
        </article>

      </div>
    </main>
  </div>

  <script src="assets/supabase.js"></script>
  <script src="assets/ceres-data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    let allCriticos = [];

    function getAcao(dias) {
      if (dias > 365) return { acao: "Visita presencial urgente + proposta de reativação", arg: "Resgatar relacionamento com proposta de condições especiais. Mencionar novidades em equipamentos.", prioridade: "🔴 Crítica" };
      if (dias > 180) return { acao: "Ligação de reativação + envio de catálogo atualizado", arg: "Abordagem consultiva sobre safra atual e necessidades futuras. Oferecer demonstração sem compromisso.", prioridade: "🟠 Alta" };
      if (dias > 120) return { acao: "Contato telefônico + agendamento de visita técnica", arg: "Reforçar valor do produto com ROI projetado. Oferecer condições de financiamento facilitado.", prioridade: "🟡 Média-Alta" };
      return { acao: "Contato por WhatsApp/e-mail + follow-up em 7 dias", arg: "Manter relacionamento ativo. Compartilhar case de sucesso de cliente similar na região.", prioridade: "🟡 Média" };
    }

    function renderCriticos(list) {
      const el = document.getElementById("criticos-list");
      el.innerHTML = "";
      list.slice(0, 50).forEach(c => {
        const sugestao = getAcao(c.diasSemContato);
        const div = document.createElement("div");
        div.className = "critico-card";
        div.innerHTML = `
          <div class="critico-info">
            <div class="critico-title">
              <span class="critico-name">${c.nome}</span>
              <span class="dias-badge">${c.diasSemContato} dias</span>
              <span class="priority-badge">${sugestao.prioridade}</span>
            </div>
            <div class="critico-meta">
              <span>📍 ${c.cidade}</span>
              <span>👤 ${(c.vendedor || "").split(" ").slice(-1)[0]}</span>
              <span>🕐 Último: ${c.ultimaData || "—"}</span>
            </div>
            <div class="critico-stats">
              <div class="critico-stat"><div class="critico-stat-val">${c.totalAcoes}</div><div class="critico-stat-lbl">Ações</div></div>
              <div class="critico-stat"><div class="critico-stat-val">${c.visitas}</div><div class="critico-stat-lbl">Visitas</div></div>
              <div class="critico-stat"><div class="critico-stat-val">${c.ultimoTipo || "—"}</div><div class="critico-stat-lbl">Última ação</div></div>
              <div class="critico-stat"><div class="critico-stat-val">${c.diasSemContato}</div><div class="critico-stat-lbl">Dias</div></div>
            </div>
            ${c.ultimaObs ? `<div class="critico-obs">${c.ultimaObs}</div>` : ""}
          </div>
          <div class="critico-action">
            <div class="critico-action-title">▼ Ação Recomendada</div>
            <div class="critico-action-what">${sugestao.acao}</div>
            <div style="height:6px;"></div>
            <div class="critico-action-arg">${sugestao.arg}</div>
          </div>`;
        el.appendChild(div);
      });
      document.getElementById("criticos-count").textContent = `Exibindo ${Math.min(50, list.length)} de ${list.length} clientes críticos`;
    }

    async function init() {
      await window.CERES_DATA_READY;
      const D = window.CERES_DATA;
      const C = VOUX_CHART.COLORS;

      VOUX_LAYOUT.renderTopbar({ section: "COMERCIAL CRM", title: "Clientes <em>Críticos</em>" });
      VOUX_LAYOUT.renderToolbar({ period: "Base atual" });

      // Build criticos from vendedores.topClientes (>=90 dias)
      const clienteMap = new Map();
      D.crm.vendedores.forEach(v => {
        v.topClientes.forEach(c => {
          if (c.diasSemContato < 90) return;
          const key = `${c.nome}|${v.nome}`;
          if (!clienteMap.has(key)) {
            // find last obs
            const lastReg = D.crm.registrosRecentes.find(r => r.cliente === c.nome && r.vendedor === v.nome);
            clienteMap.set(key, {
              nome: c.nome,
              cidade: c.cidade,
              vendedor: v.nome,
              diasSemContato: c.diasSemContato,
              totalAcoes: c.acoes,
              visitas: c.visitas,
              ultimaData: lastReg?.dtConclusao || "—",
              ultimaObs: lastReg?.obs || "",
              ultimoTipo: lastReg?.tipoAcao || "—",
            });
          }
        });
      });
      allCriticos = Array.from(clienteMap.values())
        .sort((a, b) => b.diasSemContato - a.diasSemContato);

      // KPIs
      document.getElementById("kpi-criticos").textContent = D.fmtNum(allCriticos.length);
      document.getElementById("kpi-180").textContent = D.fmtNum(allCriticos.filter(c => c.diasSemContato > 180).length);
      document.getElementById("kpi-365").textContent = D.fmtNum(allCriticos.filter(c => c.diasSemContato > 365).length);
      const media = allCriticos.length > 0
        ? Math.round(allCriticos.reduce((s, c) => s + c.diasSemContato, 0) / allCriticos.length) : 0;
      document.getElementById("kpi-media").textContent = D.fmtNum(media);

      // Faixas chart
      const faixas = { "90-120d": 0, "120-180d": 0, "180-365d": 0, "+365d": 0 };
      allCriticos.forEach(c => {
        if (c.diasSemContato > 365) faixas["+365d"]++;
        else if (c.diasSemContato > 180) faixas["180-365d"]++;
        else if (c.diasSemContato > 120) faixas["120-180d"]++;
        else faixas["90-120d"]++;
      });
      VOUX_CHART.barH(
        document.getElementById("chart-faixas"),
        Object.entries(faixas).map(([label, value]) => ({ label, value })),
        { color: C.danger, height: 210, rowH: 30 }
      );

      // Por consultor
      const consultorMap = {};
      allCriticos.forEach(c => {
        const n = (c.vendedor || "").split(" ").slice(-1)[0];
        consultorMap[n] = (consultorMap[n] || 0) + 1;
      });
      const porConsultor = Object.entries(consultorMap)
        .map(([label, value]) => ({ label, value }))
        .sort((a, b) => b.value - a.value).slice(0, 12);
      if (porConsultor.length) {
        VOUX_CHART.barH(
          document.getElementById("chart-por-consultor"),
          porConsultor,
          { color: C.warning, height: 210, rowH: 26 }
        );
      }

      // Filter dropdowns
      const consultorSel = document.getElementById("filter-consultor");
      [...new Set(allCriticos.map(c => c.vendedor).filter(Boolean))].sort()
        .forEach(v => {
          const opt = document.createElement("option");
          opt.value = v; opt.textContent = v;
          consultorSel.appendChild(opt);
        });

      function applyFilters() {
        const fV = consultorSel.value;
        const fF = document.getElementById("filter-faixa").value;
        let list = allCriticos;
        if (fV) list = list.filter(c => c.vendedor === fV);
        if (fF) {
          const min = parseInt(fF);
          const max = min === 90 ? 120 : min === 120 ? 180 : min === 180 ? 365 : 9999;
          list = list.filter(c => c.diasSemContato >= min && c.diasSemContato < max);
        }
        renderCriticos(list);
      }
      consultorSel.addEventListener("change", applyFilters);
      document.getElementById("filter-faixa").addEventListener("change", applyFilters);
      renderCriticos(allCriticos);
    }
    init();
  </script>
</body>
</html>
