<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrativo · Ceres BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="assets/font-system.js"></script>
  <link rel="stylesheet" href="assets/voux.css">
  <link rel="stylesheet" href="assets/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .admin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; margin-top:8px; }
    .admin-card { background:var(--voux-surface); border:1px solid var(--voux-border); border-radius:16px; padding:22px; transition:border-color .2s; }
    .admin-card:hover { border-color:rgba(212,184,150,.25); }
    .admin-card__head { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .admin-avatar { width:42px; height:42px; border-radius:50%; background:rgba(212,184,150,.15); border:1px solid rgba(212,184,150,.3); display:flex; align-items:center; justify-content:center; font-family:"Instrument Serif",serif; font-size:17px; color:var(--voux-champagne-400); flex-shrink:0; }
    .admin-name { font-size:13px; font-weight:600; color:var(--voux-text); line-height:1.3; }
    .admin-role { font-size:9px; font-family:"JetBrains Mono",monospace; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--voux-text-muted); margin-top:1px; }
    .admin-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
    .admin-stat { text-align:center; padding:8px 4px; background:rgba(255,255,255,.03); border-radius:10px; }
    .admin-stat-val { font-family:"JetBrains Mono",monospace; font-size:16px; font-weight:700; color:var(--voux-text-soft); }
    .admin-stat-lbl { font-size:9px; color:var(--voux-text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
    .tipo-tags { display:flex; flex-wrap:wrap; gap:5px; }
    .tipo-tag { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:20px; font-size:9px; font-family:"JetBrains Mono",monospace; font-weight:600; background:rgba(255,255,255,.06); color:var(--voux-text-muted); border:1px solid rgba(255,255,255,.08); }
    .tipo-tag-count { font-weight:700; color:var(--voux-champagne-400); }
    .last-action { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); }
    .last-action-label { font-size:9px; font-weight:700; color:var(--voux-text-muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
    .last-action-row { font-size:11px; color:var(--voux-text-muted); display:flex; gap:10px; flex-wrap:wrap; }
    .last-action-date { font-family:"JetBrains Mono",monospace; font-size:10px; color:var(--voux-champagne-400); }
  </style>
</head>
<body data-page="administrativo">
  <div class="app">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar" data-topbar></header>
      <div class="toolbar" data-toolbar></div>
      <div class="content">

        <section class="kpis">
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">01 · Usuários Admin</span></div>
            <div class="kpi__value voux-num" id="kpi-admins">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">usuários internos</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">02 · Total de Ações</span></div>
            <div class="kpi__value voux-num" id="kpi-acoes">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">registros totais</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">03 · Visitas</span></div>
            <div class="kpi__value voux-num" id="kpi-visitas">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">visitas a campo</div>
          </div>
          <div class="kpi">
            <div class="kpi__head"><span class="kpi__label">04 · Clientes Atendidos</span></div>
            <div class="kpi__value voux-num" id="kpi-clientes">—</div>
            <div class="kpi__delta" style="color:var(--voux-text-muted);">clientes únicos</div>
          </div>
        </section>

        <!-- Charts -->
        <div class="grid-12">
          <article class="voux-card col-6">
            <div class="voux-card__head"><div>
              <div class="voux-card__label">01 · AÇÕES</div>
              <h3 class="voux-card__title">Ações <em>por Admin</em></h3>
            </div></div>
            <div class="chart-canvas" id="chart-acoes" style="height:200px;"></div>
          </article>
          <article class="voux-card col-6">
            <div class="voux-card__head"><div>
              <div class="voux-card__label">02 · TIPOS</div>
              <h3 class="voux-card__title">Tipos de Ação <em>Admin</em></h3>
            </div></div>
            <div class="chart-canvas" id="chart-tipos" style="height:200px;"></div>
          </article>
        </div>

        <!-- Evolução mensal -->
        <article class="voux-card">
          <div class="voux-card__head"><div>
            <div class="voux-card__label">03 · EVOLUÇÃO</div>
            <h3 class="voux-card__title">Atividade Administrativa <em>por Mês</em></h3>
          </div></div>
          <div class="chart-canvas" id="chart-evolucao" style="height:240px;"></div>
        </article>

        <!-- Cards por admin -->
        <article class="voux-card">
          <div class="voux-card__head"><div>
            <div class="voux-card__label">04 · EQUIPE</div>
            <h3 class="voux-card__title">Detalhe <em>por Usuário</em></h3>
          </div></div>
          <div class="admin-grid" id="admin-grid"></div>
        </article>

      </div>
    </main>
  </div>

  <script src="assets/supabase.js"></script>
  <script src="assets/ceres-data.js"></script>
  <script src="assets/charts.js"></script>
  <script src="assets/layout.js"></script>
  <script>
    async function init() {
      await window.CERES_DATA_READY;
      const D = window.CERES_DATA;
      const C = VOUX_CHART.COLORS;
      const regs = D.crm.registrosRecentes;

      VOUX_LAYOUT.renderTopbar({ section: "COMERCIAL CRM", title: "Dashboard <em>Administrativo</em>" });
      VOUX_LAYOUT.renderToolbar({ period: "Base atual" });

      // Build per-admin stats
      const adminMap = {};
      regs.forEach(r => {
        const v = r.vendedor;
        if (!v || !D.isAdminUser(v)) return;
        if (!adminMap[v]) {
          adminMap[v] = { nome: v, acoes: 0, visitas: 0, clientes: new Set(), tiposAcao: {}, tiposContato: {}, lastDate: null, lastCliente: null, lastTipo: null };
        }
        const a = adminMap[v];
        a.acoes++;
        if ((r.tipoContato || "").toLowerCase().includes("visita")) a.visitas++;
        if (r.cliente) a.clientes.add(r.cliente);
        if (r.tipoAcao) a.tiposAcao[r.tipoAcao] = (a.tiposAcao[r.tipoAcao] || 0) + 1;
        if (r.tipoContato) a.tiposContato[r.tipoContato] = (a.tiposContato[r.tipoContato] || 0) + 1;
        if (!a.lastDate || r.dtConclusao > a.lastDate) {
          a.lastDate = r.dtConclusao; a.lastCliente = r.cliente; a.lastTipo = r.tipoAcao;
        }
      });

      const admins = Object.values(adminMap).sort((a, b) => b.acoes - a.acoes);

      // KPIs globais
      const totalAcoes   = admins.reduce((s, a) => s + a.acoes, 0);
      const totalVisitas = admins.reduce((s, a) => s + a.visitas, 0);
      const allClientes  = new Set(regs.filter(r => D.isAdminUser(r.vendedor) && r.cliente).map(r => r.cliente));
      document.getElementById("kpi-admins").textContent   = D.fmtNum(admins.length);
      document.getElementById("kpi-acoes").textContent    = D.fmtNum(totalAcoes);
      document.getElementById("kpi-visitas").textContent  = D.fmtNum(totalVisitas);
      document.getElementById("kpi-clientes").textContent = D.fmtNum(allClientes.size);

      // Charts
      if (admins.length) {
        VOUX_CHART.barH(
          document.getElementById("chart-acoes"),
          admins.map(a => ({ label: a.nome.split(" ").slice(-1)[0], value: a.acoes })),
          { color: C.accent, height: 190, rowH: 28 }
        );
      }

      // Global tipos de ação aggregated
      const globalTipos = {};
      admins.forEach(a => { Object.entries(a.tiposAcao).forEach(([k, v]) => { globalTipos[k] = (globalTipos[k] || 0) + v; }); });
      const tiposData = Object.entries(globalTipos).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value).slice(0, 8);
      if (tiposData.length) {
        VOUX_CHART.barH(document.getElementById("chart-tipos"), tiposData, { color: C.info, height: 190, rowH: 26 });
      }

      // Evolução mensal
      const evolMap = {};
      regs.filter(r => D.isAdminUser(r.vendedor)).forEach(r => {
        const ym = (r.dtConclusao || "").slice(0, 7);
        if (!ym) return;
        evolMap[ym] = (evolMap[ym] || 0) + 1;
      });
      const evolKeys = Object.keys(evolMap).sort().slice(-18);
      if (evolKeys.length) {
        VOUX_CHART.barV(
          document.getElementById("chart-evolucao"),
          evolKeys.map(k => D.fmtMonthYear(k)),
          [{ name: "Ações Admin", color: C.accent, values: evolKeys.map(k => evolMap[k]) }],
          { height: 230 }
        );
      }

      // Admin cards
      const grid = document.getElementById("admin-grid");
      admins.forEach(a => {
        const initials = a.nome.split(" ").filter(Boolean).slice(0, 2).map(n => n[0].toUpperCase()).join("");
        const topTipos = Object.entries(a.tiposAcao).sort((x, y) => y[1] - x[1]).slice(0, 5);
        const card = document.createElement("div");
        card.className = "admin-card";
        card.innerHTML = `
          <div class="admin-card__head">
            <div class="admin-avatar">${initials}</div>
            <div>
              <div class="admin-name">${a.nome}</div>
              <div class="admin-role">Administrativo</div>
            </div>
          </div>
          <div class="admin-stats">
            <div class="admin-stat">
              <div class="admin-stat-val">${a.acoes}</div>
              <div class="admin-stat-lbl">Ações</div>
            </div>
            <div class="admin-stat">
              <div class="admin-stat-val">${a.visitas}</div>
              <div class="admin-stat-lbl">Visitas</div>
            </div>
            <div class="admin-stat">
              <div class="admin-stat-val">${a.clientes.size}</div>
              <div class="admin-stat-lbl">Clientes</div>
            </div>
          </div>
          ${topTipos.length ? `<div class="tipo-tags">${topTipos.map(([tipo, cnt]) =>
            `<span class="tipo-tag">${tipo}<span class="tipo-tag-count">(${cnt})</span></span>`).join("")}</div>` : ""}
          ${a.lastDate ? `
          <div class="last-action">
            <div class="last-action-label">Última ação</div>
            <div class="last-action-row">
              <span class="last-action-date">${a.lastDate}</span>
              ${a.lastCliente ? `<span>${a.lastCliente}</span>` : ""}
              ${a.lastTipo ? `<span style="color:var(--voux-text-muted);">${a.lastTipo}</span>` : ""}
            </div>
          </div>` : ""}`;
        grid.appendChild(card);
      });

      if (!admins.length) {
        grid.innerHTML = `<div style="color:var(--voux-text-muted);font-size:13px;padding:20px 0;">Nenhum usuário administrativo encontrado nos registros.</div>`;
      }
    }
    init();
  </script>
</body>
</html>
