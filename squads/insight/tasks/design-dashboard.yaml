name: design-dashboard
version: 1.0.0
description: "Criar spec visual de dashboard BI"

trigger: "Quando há necessidade de criar ou redesenhar dashboard"

inputs:
  - Specs de KPIs (@bi-strategist)
  - Layout atual do dashboard
  - Design system (cores, fontes, componentes)
  - Requisitos de responsividade

outputs:
  - docs/dashboard-spec.md (spec visual completa)
  - Componentes React (via @dev)
  - Layout grid specification

steps:
  - name: understand_requirements
    description: "Entender requisitos do dashboard"
    actions:
      - Identificar KPIs principais
      - Definir público (quem vai usar)
      - Mapear jornada de uso (daily/weekly/monthly)

  - name: choose_charts
    description: "Escolher tipo de visualização para cada KPI"
    actions:
      - Aplicar chart selection matrix
      - Justificar escolha de chart por KPI
      - Definir cores por categoria

  - name: layout_design
    description: "Definir layout do dashboard"
    template: |
      ## Layout: [Nome do Dashboard]
      ### Grid: 12 colunas, gap 16px

      ```
      ┌─────────────────────────────────────────┐
      │ KPI Card    │ KPI Card    │ KPI Card   │
      │ Receita     │ Conversão    │ Visitas    │
      ├─────────────────────────────────────────┤
      │                                     │   │
      │         Line Chart                   │ K │
      │         (Receita 12 meses)          │ P │
      │                                     │ I │
      ├─────────────────────────────────────────┤
      │ Bar Chart    │    Donut Chart        │   │
      │ (Top 10)     │    (Mix)              │   │
      └─────────────────────────────────────────┘
      ```

  - name: define_interactions
    description: "Definir interações e estados"
    actions:
      - Tooltips (o que mostrar no hover)
      - Click (drill-down para detalhes?)
      - Filtros (date range, categoria, vendedor)
      - Loading states
      - Empty states

  - name: responsive_spec
    description: "Especificar responsividade"
    breakpoints:
      - mobile: "1 coluna, cards empilhados"
      - tablet: "2 colunas"
      - desktop: "grid completo"

  - name: a11y_check
    description: "Verificar acessibilidade"
    checklist:
      - Labels ARIA para charts
      - Contraste de cores
      - Navegação por teclado
      - Screen reader compatible

examples:
  dashboard: "BiPainel"
  kpis:
    - name: "Total Negócios"
      chart: "KPICard"
      position: "top-left"
    - name: "Receita"
      chart: "KPICard"
      position: "top"
    - name: "Conversão"
      chart: "KPICard"
      position: "top"
  charts:
    - name: "Receita Mensal"
      type: "LineChart"
      size: "full-width"
      filters: ["dateRange", "categoria"]
    - name: "Top 10 Produtos"
      type: "BarHChart"
      size: "half-width"
