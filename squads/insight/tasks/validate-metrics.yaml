name: validate-metrics
version: 1.0.0
description: "Validar métricas e dados do BI"

trigger: "Após implementação de nova métrica ou suspeita de erro"

inputs:
  - Hooks de KPIs implementados
  - Queries SQL executadas
  - Dashboard renderizado
  - Dados fonte no banco

outputs:
  - Relatório de validação (PASS/FAIL)
  - Lista de Issues encontrados
  - Recomendações de correção

steps:
  - name: query_validation
    description: "Validar estrutura de queries"
    checks:
      - SQL sintaxe correta
      - Joins sem duplicação
      - Filtros aplicam corretamente
      - GROUP BY adequado
      - HAVING quando necessário

  - name: data_sanity
    description: "Sanity check nos dados"
    checks:
      - Valores >= 0 para contagens
      - Percentuais entre 0-100
      - Moedas com 2 decimais
      - Datas dentro de range válido
      - Strings sem truncamento incorreto

  - name: cross_validation
    description: "Validação cruzada de métricas"
    checks:
      - "Soma(parts) = total?"
      - "Métricas relacionadas consistentes?"
      - "Tendência faz sentido contextual?"
      - "Comparativo com período anterior OK?"

  - name: runtime_validation
    description: "Testar em runtime"
    checks:
      - Componente renderiza sem erro
      - Sem erros no console
      - Loading state funciona
      - Empty state quando sem dados
      - Responsivo em mobile

  - name: report
    description: "Emitir relatório de validação"
    template: |
      ## Validação: [Nome da Métrica]
      ### Status: ✅ PASS / ❌ FAIL

      #### Query Validation
      - [ ] SQL válido
      - [ ] Joins corretos
      - [ ] Filtros OK

      #### Data Sanity
      - [ ] Valores válidos
      - [ ] Formatos corretos

      #### Cross Validation
      - [ ] Consistência verificada

      #### Runtime
      - [ ] Renderiza OK
      - [ ] Sem erros console

      #### Issues (se FAIL)
      1. [Issue description]
      2. [Issue description]

      #### Recommendations
      - [Recomendação 1]
      - [Recomendação 2]

examples:
  valid_pass:
    metric: "Receita Máquinas"
    status: "PASS"
    notes:
      - "Query correta"
      - "Valores dentro do esperado"
      - "Renderiza OK"

  valid_fail:
    metric: "Taxa Conversão"
    status: "FAIL"
    issues:
      - "Divisão por zero quando total_visitas = 0"
      - "Tooltip mostrando '%' mas valor é decimal"
    recommendations:
      - "Adicionar guard clause: if total === 0 return 'N/A'"
      - "Aplicar toFixed(1) antes de concatenar '%'"
