name: insight
version: 0.1.0
description: "Squad de Business Intelligence para Ceres BI — Agro (máquinas, peças, visitas, ações)"
author: "@squad-creator"
created: 2026-06-22

domain:
  industry: Agro
  business: Máquinas agrícolas, peças, visitas técnicas, ações comerciais
  client: Ceres

model:
  tier: opus
  all_agents: opus

components:
  agents:
    - agents/bi-strategist.yaml
    - agents/bi-visualizer.yaml
    - agents/bi-validator.yaml
  tasks:
    - tasks/define-kpis.yaml
    - tasks/design-dashboard.yaml
    - tasks/validate-metrics.yaml
  templates:
    - docs/kpis-agro.md
    - docs/dashboard-spec.md

dependencies:
  - "@pm (Morgan)"    # Prioridades de negócio, roadmap
  - "@ux (Uma)"       # Design system, padrões de layout
  - "@dev (Dex)"      # Implementação de componentes
  - "@qa (Quinn)"     # Testes e qualidade

handoffs:
  input_from:
    - "@pm"    # Recebe prioridades de produto
    - "@ux"    # Recebe specs visuais
  output_to:
    - "@dev"   # Entrega specs para implementação
    - "@qa"    # Entrega para validação

pages_context:
  - BiPainel
  - BiInteligencia
  - BiAcoes
  - BiComercial
  - BiOperacional
  - BiPedidos
  - BiProdutos
  - BiServicos
  - BiAdmin
